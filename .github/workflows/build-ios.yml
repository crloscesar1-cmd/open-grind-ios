name: Build Open Grind iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-build-version

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Download Open Grind
        run: git clone --recurse-submodules "https://git.opengrind.org/open-grind/open-grind.git"

      - name: Modify Google Login
        working-directory: open-grind
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/src/api/google_oauth/web.rs")
          s = p.read_text()

          changes = {
              ".incognito(true)": ".incognito(!cfg!(target_os = \"ios\"))",
              "let _ = window.clear_all_browsing_data();": "if !cfg!(target_os = \"ios\") { let _ = window.clear_all_browsing_data(); }"
          }

          for old, new in changes.items():
              if s.count(old) != 1:
                  raise SystemExit("Source code changed; review required")
              s = s.replace(old, new)

          p.write_text(s)
          print("Google login persistence modified")
          PY

      - name: Commit Google Login Changes
        working-directory: open-grind
        run: |
          git config user.name "Local Builder"
          git config user.email "builder@example.com"
          git add src-tauri/src/api/google_oauth/web.rs
          git commit -m "Preserve Google login session on iOS"
          git status --short

      - name: Build IPA
        working-directory: open-grind
        run: bun run package:ios

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Open-Grind-iOS-Persistent-Login
          path: open-grind/**/*.ipa
          if-no-files-found: error
